<section id="hero" nav="" backgroundType="dark" [attr.darkUi]="false" appObserveSection="hero">

    <div class="intro-text">
        <div>
            <p>{{ 'HERO.GREETING' | translate }}</p>
            <h1 class="font-eczar">Nils<br>Neumann</h1>
            <p>{{ 'HERO.ROLE' | translate }}</p>

            <button (click)="scrollToSection('contact')">
                {{ 'HERO.CTA' | translate }}
            </button>
        </div>

        <div class="scroll-button-container">
            <nav class="scroll-down-button">
                <mat-icon svgIcon="flower" class="rotating-icon"></mat-icon>
                <mat-icon svgIcon="arrow" class="arrow-icon"></mat-icon>
                <svg viewBox="0 0 100 100" class="arc-text-svg">
                    <defs>
                        <path id="circlePath" d="M50,50 m-45,0 a45,45 0 1,1 90,0 a45,45 0 1,1 -90,0" />
                    </defs>
                    <text text-anchor="middle">
                        <textPath href="#circlePath" startOffset="50%">
                            {{ 'HERO.SCROLL' | translate }}
                        </textPath>
                    </text>
                </svg>
            </nav>
        </div>
    </div>

    <div class="hero-display">
        <img class="hero-image" src="../../assets/portraits/Hero.png" alt="">
        <mat-icon svgIcon="flower" class="hero-display-flower"></mat-icon>
    </div>

</section>
